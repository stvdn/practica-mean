<form [formGroup]="form" (ngSubmit)="submit()" [attr.aria-busy]="busy" novalidate>
  <fieldset [disabled]="busy">
    <label for="auth-email">Correo electrónico</label>
    <input id="auth-email" type="email" formControlName="email" autocomplete="username"
      [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
      aria-describedby="email-error">
    <span id="email-error" class="field-error" *ngIf="form.controls.email.touched && form.controls.email.invalid">
      Ingrese un correo electrónico válido.
    </span>
    <label for="auth-password">Contraseña</label>
    <input id="auth-password" type="password" formControlName="password"
      [autocomplete]="registering ? 'new-password' : 'current-password'"
      [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
      aria-describedby="password-help password-error">
    <p id="password-help">Use al menos 6 caracteres y un máximo de 72 bytes UTF-8.</p>
    <span id="password-error" class="field-error" *ngIf="form.controls.password.touched && form.controls.password.invalid">
      La contraseña debe cumplir la longitud indicada.
    </span>
    <div class="actions">
      <button type="submit" [disabled]="busy">{{ busy ? 'Procesando…' : registering ? 'Crear cuenta' : 'Iniciar sesión' }}</button>
    </div>
  </fieldset>
</form>
